name: Build Repo UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 1. Build Store Project (หน้าหลัก) ───────────────────
      - name: Install & Build Store
        run: |
          cd store
          npm install
          npm run build

      # ── 2. Build Get UDID Project ─────────────────────────
      - name: Install & Build Get UDID
        run: |
          cd get-udid
          npm install
          npm run build

      # ── 3. Build UDID Info Project ────────────────────────
      - name: Install & Build UDID Info
        run: |
          cd udid-info
          npm install
          npm run build

      # ── 4. Combine Build Outputs into Dist Folder ─────────
      - name: Prepare Final Dist Folder
        run: |
          mkdir -p dist
          # ก๊อปปี้ไฟล์จาก store/dist ไปไว้ที่ root ของ dist/
          cp -r store/dist/* dist/
          
          # สร้างโฟลเดอร์ย่อย และก๊อปปี้ไฟล์จาก get-udid/dist เข้าไป
          mkdir -p dist/get-udid
          cp -r get-udid/dist/* dist/get-udid/
          
          # สร้างโฟลเดอร์ย่อย และก๊อปปี้ไฟล์จาก udid-info/dist เข้าไป
          mkdir -p dist/udid-info
          cp -r udid-info/dist/* dist/udid-info/

      # ── 5. Upload Final Artifact ─────────────────────────
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build-output
          path: dist/
          retention-days: 7
